<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#16111f;color:#eee;font:17px system-ui;padding:24px}button{font:inherit;padding:14px;background:#cda1f1;border:0;border-radius:9px}</style><h2>Prueba WebAudio</h2><p>Primero pulsa «♫ Escuchar» abajo, acepta la autorización de Android y después inicia el tono.</p><button onclick="play()">▶ Emitir tono (3 s)</button><p>Una lectura de audio confirma captura del tono, NO traducción de voz ni compatibilidad con todo YouTube.</p><script>function play(){const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+3);o.onended=()=>c.close()}</script></html>
